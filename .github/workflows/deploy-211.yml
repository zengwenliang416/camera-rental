name: Deploy camera rental to 211

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-211.yml'
      - 'ops/github-deploy/**'
      - 'camera-rental-server/**'
      - 'camera-rental-admin/**'
      - 'camera-rental-schedule-center/**'
      - 'camera-rental-staff/**'
      - 'camera-rental-web/**'

permissions:
  contents: read

concurrency:
  group: camera-rental-211-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production-211
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          HOST="${DEPLOY_HOST:-211.101.246.160}"
          PORT="${DEPLOY_PORT:-22}"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts
          fi

      - name: Build and deploy on production host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          HOST="${DEPLOY_HOST:-211.101.246.160}"
          PORT="${DEPLOY_PORT:-22}"
          USER="${DEPLOY_USER:-root}"
          ROOT="${DEPLOY_ROOT:-/opt/camera-rental}"
          SSH_OPTS=(-i ~/.ssh/deploy_key -p "${PORT}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          SCP_OPTS=(-i ~/.ssh/deploy_key -P "${PORT}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20)

          scp "${SCP_OPTS[@]}" \
            ops/github-deploy/server-build-deploy.sh \
            ops/github-deploy/incremental-build-lib.sh \
            "${USER}@${HOST}:/tmp/"

          printf -v root_q '%q' "${ROOT}"
          printf -v sha_q '%q' "${RELEASE_SHA}"

          ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" \
            "bash -s -- ${root_q} ${sha_q}" <<'REMOTE'
          set -euo pipefail

          DEPLOY_ROOT="$1"
          RELEASE_SHA="$2"
          readonly github_repo="zengwenliang416/camera-rental"
          readonly gitee_repo="wenliang_zeng/camera-rental"
          candidates=(
            "https://gh-proxy.com/https://github.com/${github_repo}.git"
            "https://ghfast.top/https://github.com/${github_repo}.git"
            "git@gitee.com:${gitee_repo}.git"
          )

          REPO_URL=""
          for candidate in "${candidates[@]}"; do
            echo "[github-deploy] probe ${candidate}"
            remote_sha="$(
              timeout 30 git ls-remote "${candidate}" refs/heads/main 2>/dev/null \
                | awk 'NR == 1 { print $1 }'
            )" || true
            if [ "${remote_sha}" = "${RELEASE_SHA}" ]; then
              REPO_URL="${candidate}"
              break
            fi
            echo "[github-deploy] skip mirror: expected ${RELEASE_SHA}, got ${remote_sha:-unavailable}"
          done

          if [ -z "${REPO_URL}" ]; then
            echo "[github-deploy][error] no source mirror exposes GitHub SHA ${RELEASE_SHA}" >&2
            exit 1
          fi

          echo "[github-deploy] source mirror selected: ${REPO_URL}"
          export DEPLOY_ROOT RELEASE_SHA REPO_URL
          export SOURCE_DIR="${DEPLOY_ROOT}/source"
          export GIT_SSH_COMMAND="ssh -i /root/.ssh/camera_rental_gitee_pull -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -C"

          bash /tmp/server-build-deploy.sh
          REMOTE
