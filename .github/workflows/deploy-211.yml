name: Deploy camera rental to 211

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-211.yml'
      - 'ops/github-deploy/**'
      - 'camera-rental-server/**'
      - 'camera-rental-admin/**'
      - 'camera-rental-schedule-center/**'
      - 'camera-rental-staff/**'
      - 'camera-rental-web/**'

permissions:
  contents: read

concurrency:
  group: camera-rental-211-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production-211
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          HOST="${DEPLOY_HOST:-211.101.246.160}"
          PORT="${DEPLOY_PORT:-22}"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts
          fi

      - name: Build and deploy on production host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          HOST="${DEPLOY_HOST:-211.101.246.160}"
          PORT="${DEPLOY_PORT:-22}"
          USER="${DEPLOY_USER:-root}"
          ROOT="${DEPLOY_ROOT:-/opt/camera-rental}"
          CONTROL_PATH="${RUNNER_TEMP}/camera-rental-ssh-%C"
          SSH_OPTS=(-i ~/.ssh/deploy_key -p "${PORT}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o ControlMaster=auto -o ControlPersist=15m -o ControlPath="${CONTROL_PATH}")
          SCP_OPTS=(-i ~/.ssh/deploy_key -P "${PORT}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o ControlMaster=auto -o ControlPersist=15m -o ControlPath="${CONTROL_PATH}")

          printf -v root_q '%q' "${ROOT}"
          remote_source_sha="$(
            ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" \
              "git -C ${root_q}/source rev-parse HEAD 2>/dev/null || true"
          )"
          bundle_path="${RUNNER_TEMP}/camera-rental-source.bundle"
          bash ops/github-deploy/create-source-bundle.sh \
            "${remote_source_sha}" "${RELEASE_SHA}" "${bundle_path}"

          scp "${SCP_OPTS[@]}" \
            ops/github-deploy/server-build-deploy.sh \
            ops/github-deploy/incremental-build-lib.sh \
            "${bundle_path}" \
            "${USER}@${HOST}:/tmp/"

          printf -v sha_q '%q' "${RELEASE_SHA}"

          ssh "${SSH_OPTS[@]}" "${USER}@${HOST}" \
            "bash -s -- ${root_q} ${sha_q}" <<'REMOTE'
          set -euo pipefail

          DEPLOY_ROOT="$1"
          RELEASE_SHA="$2"
          SOURCE_BUNDLE="/tmp/camera-rental-source.bundle"
          test -s "${SOURCE_BUNDLE}"
          trap 'rm -f "${SOURCE_BUNDLE}"' EXIT

          echo "[github-deploy] source bundle received for ${RELEASE_SHA}"
          REPO_URL="${SOURCE_BUNDLE}"
          export DEPLOY_ROOT RELEASE_SHA REPO_URL
          export SOURCE_DIR="${DEPLOY_ROOT}/source"

          bash /tmp/server-build-deploy.sh
          REMOTE
